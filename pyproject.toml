[project]
name = "prediction-market-arbitrage"
version = "0.1.0"
description = "Calibrated mispricing detection and robust (Bertsimas-Sim) Kelly allocation on Polymarket/Kalshi."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test hits a live public API (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["B905", "E501", "E741", "UP037", "UP035", "E402", "UP017"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["I001"]
